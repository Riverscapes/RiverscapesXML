# Sync QGIS .qml symbology files to web .json format
# Runs automatically when QML changes are merged to master.
#
# `master` is branch-protected (pull requests + the required "validate"
# status check). This workflow relies on an exemption: the bot pushes
# with SYMBOLOGY_SYNC_TOKEN, a fine-grained PAT whose owner is on a
# team listed in the master ruleset's bypass list (repo Settings →
# Rules → Rulesets, "Always allow"). GITHUB_TOKEN (the GitHub Actions
# app identity) cannot be added to a bypass list.

name: Symbology Sync

on:
  push:
    branches:
      - master
    paths:
      - 'Symbology/qgis/**'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The bot's push back to master uses this token, so its owner
          # must be a member of a team on the master ruleset's bypass
          # list, or the push is rejected ("GH006: Protected branch
          # update failed"). Create it under Settings → Secrets and
          # variables → Actions.
          token: ${{ secrets.SYMBOLOGY_SYNC_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync
        working-directory: python

      - name: Convert missing QML → JSON
        run: uv run python QML2WebSymbology.py --missing
        working-directory: python

      - name: Commit new JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A Symbology/web/
          if git diff --cached --quiet; then
            echo "No new JSON files to commit."
          else
            git commit -m "Auto-convert QML → JSON for missing symbology files [skip ci]"
            git push
          fi
