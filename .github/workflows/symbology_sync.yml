# Sync QGIS .qml symbology files to web .json format
# Runs automatically when QML changes are merged to master.
#
# `master` is a protected branch (no direct pushes), so the generated
# JSON is delivered through a pull request opened by this workflow.

name: Symbology Sync

on:
  push:
    branches:
      - master
    paths:
      - 'Symbology/qgis/**'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync
        working-directory: python

      - name: Convert missing QML → JSON
        run: uv run python QML2WebSymbology.py --missing
        working-directory: python

      # The generated JSON cannot be pushed straight to master (branch
      # protection requires pull requests), so it goes onto a dedicated
      # bot branch and is delivered via a pull request.
      - name: Commit new JSON files to a bot branch
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A Symbology/web/
          if git diff --cached --quiet; then
            echo "No new JSON files to commit."
          else
            BRANCH="bot/symbology-sync-${{ github.run_id }}"
            git checkout -b "$BRANCH"
            git commit -m "Auto-convert QML → JSON for missing symbology files"
            git push -u origin "$BRANCH"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.commit.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base master \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "Auto-convert QML → JSON for missing symbology files" \
            --body "Auto-generated by the **Symbology Sync** workflow from the current [QML files](https://github.com/Riverscapes/RiverscapesXML/tree/master/Symbology/qgis). No manual review of the JSON content is required beyond confirming the required checks pass."

      # Best-effort: merge the PR as soon as the required "validate" check
      # passes. If branch protection also requires an approving review (or
      # auto-merge is disabled), the PR is left open for a human to merge
      # and the workflow still reports success with the PR link.
      - name: Auto-merge pull request when checks pass
        if: steps.commit.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ steps.commit.outputs.branch }}"
          PR_NUMBER=$(gh pr view "$BRANCH" --json number --jq '.number' 2>/dev/null || true)
          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request found for $BRANCH; nothing to merge."
            exit 0
          fi
          if gh pr merge "$PR_NUMBER" --merge --auto; then
            echo "Pull request #$PR_NUMBER merged (or auto-merge enabled)."
          else
            echo "Could not merge pull request #$PR_NUMBER automatically."
            echo "It is ready for a human to merge when the required checks pass:"
            echo "https://github.com/Riverscapes/RiverscapesXML/pull/$PR_NUMBER"
          fi
