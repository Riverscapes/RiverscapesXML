# Sync QGIS .qml symbology files to web .json format
# Runs automatically when QML changes are merged to master.
#
# `master` is branch-protected (pull requests + the required "validate"
# status check). This workflow relies on an exemption: the built-in
# "GitHub Actions" app is on the branch ruleset's bypass list (repo
# Settings → Rules → Rulesets), so the bot's GITHUB_TOKEN can commit
# the generated JSON straight to master. Without that bypass, the push
# is rejected ("GH006: Protected branch update failed").

name: Symbology Sync

on:
  push:
    branches:
      - master
    paths:
      - 'Symbology/qgis/**'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync
        working-directory: python

      - name: Convert missing QML → JSON
        run: uv run python QML2WebSymbology.py --missing
        working-directory: python

      - name: Commit new JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A Symbology/web/
          if git diff --cached --quiet; then
            echo "No new JSON files to commit."
          else
            git commit -m "Auto-convert QML → JSON for missing symbology files [skip ci]"
            git push
          fi
